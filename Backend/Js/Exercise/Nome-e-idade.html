<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pergunta e resposta</title>
</head>
<body>
    <script>
        window.alert('Bem vindo, aqui iremos fazer algumas perguntas')

        var p2 = (window.prompt('Qual seria sua profissão'))
        var p3 = (window.prompt('Nos fale sua idade'))

        write(`Pela suas respostas descobrimos que seu nome é ${p1} e sua profissão é ${p2} e su idade ${p3}`)
    </script>
</body>
</html>
