<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body{
            background: rgb(68, 125, 199);
            color: white;

        }
    </style>
</head>
<body>
    <h1> estender o basico de DOM</h1>
    <p>Aqui vai o resultado</p>
    <div id="Outra aba">Clique aqui</div>

    <script>
        const p1 = window.document.getElementsByTagName('p')[0]
        window.document.write('Esta ecrito assim: ' + p1.innerText)
        /*
        const a = window.document.getElementById('Outra aba')
        a.innerText = 'Estou aguardando'
        */

        const d = window.document.querySelector('div#Outra aba')
        d.style.background = 'red'
    </script>
</body>
</html>
