<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script</title>
</head>
<body>   <h1>Sobre</h1>

    <script>
        var n1 = Number (window.prompt('digite um numero: ')) // string
        var n2 = Number (window.prompt('digite outro numero: ')) // string
        var resultado = n1 + n2
        window.alert(`A soma de ${n1} e ${n2} dá ${resultado}`)
        // o + pode servir para concatenação
        // e para adição
        // para ele fazer adição ter que ser um number de um lado e do outro um number (number + number)
        // mas se for string e outra string ele ira transformar em uma concatenação (string + string)

        // Para poder fazer ele somar tem que tranformar a string em um numero usando três tipo os dois primeiro da versão antiga
        // Number.parseInt e Number.parseFloat o primeiro é apenas para numero inteiro e o segundo para real
        // e o mais recente Number o Js ele mesmo decide qual é o numero

        // e você consegue tranformar number em string usando String(n) ou n.toString()
    </script>
</body>
</html>
